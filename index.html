    <!-- Immediately unregister any old/rogue Service Workers from other localhost projects -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('Successfully unregistered old service worker:', registration);
          }
        });
      }
    </script>
